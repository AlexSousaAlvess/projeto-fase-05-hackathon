services:

  # ─── Mensageria ──────────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Bancos de Dados ─────────────────────────────────────────────────────────
  citizen-db:
    image: postgres:16-alpine
    container_name: citizen-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: citizendb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - citizen-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  health-action-db:
    image: postgres:16-alpine
    container_name: health-action-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: healthactiondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - health-action-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  points-db:
    image: postgres:16-alpine
    container_name: points-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: pointsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - points-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  # ─── Infraestrutura Spring Cloud ─────────────────────────────────────────────
  discovery-server:
    build: ./services/discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      retries: 10

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_URI=http://discovery-server:8761/eureka
    depends_on:
      discovery-server:
        condition: service_healthy

  # ─── Serviços de Domínio ─────────────────────────────────────────────────────
  citizen-service:
    build: ./services/citizen-service
    container_name: citizen-service
    ports:
      - "8081:8081"
    environment:
      - DB_URL=jdbc:postgresql://citizen-db:5432/citizendb
      - DB_USER=postgres
      - DB_PASS=postgres
      - EUREKA_URI=http://discovery-server:8761/eureka
    depends_on:
      citizen-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  health-action-service:
    build: ./services/health-action-service
    container_name: health-action-service
    ports:
      - "8082:8082"
    environment:
      - DB_URL=jdbc:postgresql://health-action-db:5432/healthactiondb
      - DB_USER=postgres
      - DB_PASS=postgres
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_URI=http://discovery-server:8761/eureka
    depends_on:
      health-action-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  points-service:
    build: ./services/points-service
    container_name: points-service
    ports:
      - "8083:8083"
    environment:
      - DB_URL=jdbc:postgresql://points-db:5432/pointsdb
      - DB_USER=postgres
      - DB_PASS=postgres
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_URI=http://discovery-server:8761/eureka
    depends_on:
      points-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  sus-mock-service:
    build: ./services/sus-mock-service
    container_name: sus-mock-service
    ports:
      - "8087:8087"
    environment:
      - EUREKA_URI=http://discovery-server:8761/eureka
    depends_on:
      discovery-server:
        condition: service_healthy

volumes:
  citizen-db-data:
  health-action-db-data:
  points-db-data:
